version: 2

updates:
  # ---------------------------------------------------------------- npm ----
  # One entry covering every workspace manifest. Dependabot reads the pnpm
  # lockfile at the root, but each package.json needs listing for its own
  # dependencies to be seen.
  - package-ecosystem: npm
    directories:
      - /
      - /packages/fhir-normalize
      - /playground
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Karachi
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

    # Grouped by dependency type as well as update type, because the two are
    # merged differently: `.github/workflows/dependabot-auto-merge.yml` lets
    # development updates through on green CI and holds production ones for a
    # human. A group mixing both would have to be reviewed either way.
    #
    # Without grouping this is three directories times every dependency, which
    # is a lot of individual pull requests for a repository this size.
    groups:
      # Packages that cannot move apart, whatever the update type.
      #
      # Listed before the two below because Dependabot files a dependency into
      # the first group it matches, and these have to beat the minor/patch
      # split — a major is what breaks them, and a major is exactly what those
      # groups exclude.
      #
      # This is not hypothetical. vitest 5.0.0 and @vitest/coverage-v8 5.0.0
      # arrived as separate pull requests, and for the seven minutes between
      # them landing, `main` had vitest 5 with the version 4 coverage plugin:
      # the test run died and took the SonarQube scan with it. The plugin
      # reaches into vitest's internals and is released in lockstep, so it has
      # to be updated in lockstep.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      # The same argument. React majors land across react, react-dom and their
      # types at once, and the playground builds against all four.
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch

    ignore:
      # TypeScript is held at 5.x deliberately. tsup's rollup-plugin-dts is
      # built against TS 5.7 internals and crashes on TS 7, which would ship
      # the package with no .d.ts at all — the build "succeeds" for JS and
      # silently loses the types. Unpin only after verifying `pnpm build`
      # still emits dist/index.d.ts.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # ------------------------------------------------------ github actions ----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - '*'
