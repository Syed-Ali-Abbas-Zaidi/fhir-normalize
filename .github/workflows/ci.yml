name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Must run first: the playground resolves fhir-normalize's types from
      # dist/, so typecheck and build both fail on a clean checkout without it.
      - name: Build library
        run: pnpm --filter fhir-normalize build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build playground
        run: pnpm --filter playground build

      # Catches a publish that would ship without code, a README, or a licence.
      - name: Check publishable contents
        run: pnpm --filter fhir-normalize pack --pack-destination "$RUNNER_TEMP"
