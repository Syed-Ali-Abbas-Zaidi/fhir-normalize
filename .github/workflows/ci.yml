name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # pnpm 11 refuses to start below this, so it is the floor for every job that
  # uses the workspace. The published package supports much older Node — that
  # claim is tested separately by the `smoke` job.
  TOOLCHAIN_NODE: 22

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here needs authenticated git, and every workflow runs
          # repository-controlled code afterwards — install scripts and tests.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Must run first: the playground resolves fhir-normalize from dist/, so
      # typecheck, test and build all fail on a clean checkout without it.
      - name: Build library
        run: pnpm --filter fhir-normalize build

      - name: Lint
        run: pnpm lint

      # After lint, before typecheck: an unused export is not a type error, so
      # nothing downstream would notice one.
      - name: Unused code and dependencies
        run: pnpm knip

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build playground
        run: pnpm --filter playground build

  pack:
    name: pack
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here needs authenticated git, and every workflow runs
          # repository-controlled code afterwards — install scripts and tests.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.TOOLCHAIN_NODE }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter fhir-normalize build

      # prepack also fails the build if dist/ is missing or the README and
      # licence cannot be copied in.
      - name: Pack
        run: pnpm --filter fhir-normalize pack --pack-destination "$RUNNER_TEMP"

      - name: Confirm the tarball carries a README and a licence
        run: |
          tarball="$(find "$RUNNER_TEMP" -name 'fhir-normalize-*.tgz' | head -1)"
          contents="$(tar -tzf "$tarball")"
          echo "$contents"
          for required in package/README.md package/LICENSE package/dist/index.js \
                          package/dist/index.cjs package/dist/index.d.ts package/dist/index.d.cts; do
            echo "$contents" | grep -qx "$required" || { echo "missing $required" >&2; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-tarball
          path: ${{ runner.temp }}/fhir-normalize-*.tgz
          retention-days: 7

  smoke:
    name: consumer install (node ${{ matrix.node }})
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The range `engines.node` advertises. Installed with npm rather than
        # pnpm so the older versions are reachable, and so this exercises the
        # path a real consumer takes.
        node: [18, 20, 22, 24]

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: package-tarball
          path: ${{ runner.temp }}/pkg

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install the tarball into an empty project
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/pkg/fhir-normalize-*.tgz

      - name: Import as ESM
        working-directory: ${{ runner.temp }}/consumer
        run: |
          node --input-type=module -e "
            import { createDefaultNormalizer } from 'fhir-normalize';
            const { bundle, meta } = createDefaultNormalizer()
              .parse('{\"resourceType\":\"Patient\",\"id\":\"x\"}');
            if (meta.sourceFormat !== 'fhir-json') throw new Error('wrong format: ' + meta.sourceFormat);
            if (bundle.entry[0].resource.resourceType !== 'Patient') throw new Error('bad bundle');
            console.log('esm ok on node ' + process.versions.node);
          "

      # Every subpath must resolve under a real install, not just under the
      # workspace. `./xml` is new in 2.0 and is the only way to parse XML.
      - name: Resolve every subpath, and opt into XML
        working-directory: ${{ runner.temp }}/consumer
        run: |
          node --input-type=module -e "
            import { createDefaultNormalizer } from 'fhir-normalize';
            import { simplifyResource } from 'fhir-normalize/simplified';
            import { deIdentifyResource } from 'fhir-normalize/deidentify';
            import { fhirXmlParser } from 'fhir-normalize/xml';
            import { validateBundle } from 'fhir-normalize/validate';
            import { parseNdjsonStream } from 'fhir-normalize/stream';
            import { hl7v2Parser } from 'fhir-normalize/hl7v2';

            const plain = createDefaultNormalizer();
            if (plain.detectFormat('<Patient/>') !== null) throw new Error('xml should not be registered by default');

            const { bundle, meta } = plain.register(fhirXmlParser)
              .parse('<Patient><id value=\"x\"/></Patient>');
            if (meta.sourceFormat !== 'fhir-xml') throw new Error('wrong format: ' + meta.sourceFormat);

            const resource = bundle.entry[0].resource;
            if (simplifyResource(resource).resourceType !== 'Patient') throw new Error('simplify failed');
            if (!deIdentifyResource(resource).resource) throw new Error('deidentify failed');
            if (validateBundle(bundle).length !== 0) throw new Error('validate failed');

            // Streaming is the only async entry point, so resolving it is not
            // enough — it has to actually produce a batch.
            const lines = '{\"resourceType\":\"Patient\",\"id\":\"a\"}\n{\"resourceType\":\"Patient\",\"id\":\"b\"}\n';
            async function* chunks() { yield lines; }
            let streamed = 0;
            for await (const batch of parseNdjsonStream(chunks())) streamed += batch.bundle.entry.length;
            if (streamed !== 2) throw new Error('stream failed: ' + streamed);

            const v2 = plain.register(hl7v2Parser)
              .parse('MSH|^~\\&|A|B|C|D|20260812093000-0400||ADT^A01|1|P|2.5\rPID|1||42||DOE^JOHN');
            if (v2.meta.sourceFormat !== 'hl7v2') throw new Error('hl7v2 detection failed');
            if (v2.bundle.entry[0].resource.name[0].family !== 'DOE') throw new Error('hl7v2 mapping failed');

            console.log('subpaths ok on node ' + process.versions.node);
          "

      - name: Require as CJS
        working-directory: ${{ runner.temp }}/consumer
        run: |
          node --input-type=commonjs -e "
            const { createDefaultNormalizer, UnsupportedFormatError } = require('fhir-normalize');
            const { meta } = createDefaultNormalizer().parse('{\"resourceType\":\"Patient\"}');
            if (meta.sourceFormat !== 'fhir-json') throw new Error('wrong format: ' + meta.sourceFormat);
            try {
              createDefaultNormalizer().parse('id,name');
              throw new Error('expected UnsupportedFormatError');
            } catch (error) {
              if (!(error instanceof UnsupportedFormatError)) throw error;
            }
            console.log('cjs ok on node ' + process.versions.node);
          "
