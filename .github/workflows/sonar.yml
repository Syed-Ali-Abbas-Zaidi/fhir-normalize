name: SonarQube

# Analysis runs separately from CI rather than as another job in it, because it
# needs the coverage report and a full-depth checkout, and neither is wanted on
# the fast path that gates every push.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest

    # Skipped whenever the run cannot see SONAR_TOKEN, which is not the same
    # question as "is this a fork". A fork's pull request gets no secrets at
    # all. A Dependabot pull request is raised from a branch in this repository,
    # so a fork check passes it, but the run is handed the separate Dependabot
    # secret store and `secrets.SONAR_TOKEN` is empty there — the scanner
    # reports that as "Not authorized or project not found", which reads like a
    # broken token rather than an absent one.
    #
    # The token deliberately stays out of the Dependabot store. This job installs
    # the dependency being bumped and runs the suite, so it executes the new
    # code; handing that a credential is what separate stores exist to prevent.
    # Nothing is lost either way, because the analysis runs again on main.
    #
    # `github.actor` rather than the pull request author, because it tracks
    # secret availability exactly: once a person pushes to a Dependabot branch,
    # the run is theirs and the secrets are back.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')

    steps:
      # Fails in seconds with a usable message instead of two minutes later with
      # the scanner's. If this ever fires the condition above has a gap, or the
      # secret has been removed or has expired.
      - name: Confirm the token reached this run
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is empty for this run. Check the repository secret exists and has not expired."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Sonar reads history to attribute issues to the commit that
          # introduced them; a shallow clone dates everything to the merge.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The playground resolves fhir-normalize from dist/, so its tests need
      # the library built first — the same ordering CI relies on.
      - name: Build library
        run: pnpm --filter fhir-normalize build

      - name: Test with coverage
        run: pnpm --filter fhir-normalize test:coverage

      # vitest writes paths relative to the package it ran in; Sonar resolves
      # them against the repository root. Left alone they match nothing and
      # coverage silently reads as zero, which looks like a project with no
      # tests rather than a misconfigured path.
      - name: Make coverage paths repo-relative
        run: |
          sed -i 's|^SF:|SF:packages/fhir-normalize/|' packages/fhir-normalize/coverage/lcov.info
          head -2 packages/fhir-normalize/coverage/lcov.info

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
