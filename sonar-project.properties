sonar.projectKey=Syed-Ali-Abbas-Zaidi_fhir-normalize
sonar.organization=syed-ali-abbas-zaidi

sonar.sources=packages/fhir-normalize/src,playground
sonar.tests=packages/fhir-normalize/src,playground
sonar.test.inclusions=**/*.test.ts,**/*.test-d.ts

# Paths inside the report are rewritten to be repo-relative before the scan
# runs; vitest emits them relative to the package, and Sonar resolves them
# against the project base directory, so unrewritten they silently match
# nothing and coverage reads as zero.
sonar.javascript.lcov.reportPaths=packages/fhir-normalize/coverage/lcov.info

# Generated files and vendored spec digests. Roughly 15,000 lines of machine
# output that would dominate every metric here and attract findings against
# files a test regenerates. `sonar.coverage.exclusions` is separate from
# `sonar.exclusions` and both are needed to keep them out of the ratios.
sonar.exclusions=\
  **/*.generated.ts,\
  **/spec/*.json,\
  **/dist/**,\
  **/coverage/**,\
  **/.next/**,\
  **/node_modules/**
sonar.coverage.exclusions=\
  **/*.generated.ts,\
  **/*.config.ts,\
  playground/**,\
  packages/fhir-normalize/scripts/**

# The shape tables are deliberately repetitive — one declarative row per FHIR
# element — which a duplication detector reads as copy-paste. Excluding them
# from that one metric rather than restructuring data to please a linter.
sonar.cpd.exclusions=packages/fhir-normalize/src/simplified/shapes/**

# ---------------------------------------------------------------------------
# Findings that are wrong, and why.
#
# These live here rather than being marked "won't fix" in the web UI so the
# reasoning is reviewable, survives a project reimport, and can be argued with
# in a pull request. The bar for adding an entry is that *applying* the rule
# would make the code worse, not that the rule is annoying: a genuine style
# disagreement stays open and visible instead. Four are open on that basis, and
# so is the `XMLValidator` deprecation, which is a real signal worth keeping.
#
# S2871 — "provide a compare function to .sort()"
#   Every one of these sorts ASCII strings: element names, resource type names,
#   field keys. `localeCompare` is locale-sensitive, so taking this advice would
#   make output depend on the machine that produced it. `deidentify` is the
#   clearest case — `report.elements` is part of the public result, and two
#   machines must not disagree about it for the same input.
#
# S5332 — "using http protocol is insecure"
#   `http://loinc.org` and `http://unitsofmeasure.org` are FHIR canonical
#   system identifiers, not addresses anything fetches. The specification
#   defines them with `http://`; changing them breaks code matching.
#
# S7758 — "prefer codePointAt over charCodeAt"
#   The one call site is FNV-1a, which is defined over code units. Switching
#   would change the hash, and the hash is what pseudonymized identifiers are
#   derived from — every surrogate any consumer has already stored would stop
#   matching. Also wrong on its own terms: indexing by code point while
#   iterating by index double-counts astral characters.
#
# S6557 — "use String#startsWith"
#   Both flagged lines already call `startsWith`. What the rule is reacting to
#   is `suffix[0] !== suffix[0]?.toUpperCase()`, which asks whether the first
#   letter is capitalised. `startsWith` cannot express that.
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=sortLocale,fhirSystemUri,fnvHash,firstLetterCase

sonar.issue.ignore.multicriteria.sortLocale.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.sortLocale.resourceKey=**/*.ts

sonar.issue.ignore.multicriteria.fhirSystemUri.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.fhirSystemUri.resourceKey=**/*.ts

sonar.issue.ignore.multicriteria.fnvHash.ruleKey=typescript:S7758
sonar.issue.ignore.multicriteria.fnvHash.resourceKey=**/deidentify/surrogate.ts

sonar.issue.ignore.multicriteria.firstLetterCase.ruleKey=typescript:S6557
sonar.issue.ignore.multicriteria.firstLetterCase.resourceKey=**/*.ts

sonar.sourceEncoding=UTF-8
